spring:
  cloud:
    nacos:
      discovery:
        server-addr: 101.42.103.115:8848
      config:
        server-addr: 101.42.103.115:8848  # HTTP端口用于配置管理

server:
  port: 8081

dubbo:
  consumer:
    serialization: fastjson2  # 消费者也使用Fastjson2
    check: false              # 启动时不检查服务提供者是否存在
    timeout: 3000             # 调用超时时间（毫秒）
    retries: 2                # 失败重试次数
    lazy: true                # 延迟初始化，首次调用时才创建连接

# 腾讯云COS配置
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:your-secret-id}          # 腾讯云SecretId（建议使用环境变量）
    secret-key: ${TENCENT_COS_SECRET_KEY:your-secret-key}      # 腾讯云SecretKey（建议使用环境变量）
    region: ap-guangzhou                                        # 地域（广州）
    bucket-name: uav-pilot-1234567890                          # 存储桶名称（需要替换为实际的bucket名称）
    base-url: https://uav-pilot-1234567890.cos.ap-guangzhou.myqcloud.com  # 访问域名
    expire-time: 3600                                          # 签名URL过期时间（秒）