server:
  port: 8206

spring:
  application:
    name: service-account
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/uav_account?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.uav.model.entity.account
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Dubbo配置
dubbo:
  application:
    name: service-account
  protocol:
    name: dubbo
    port: 20886
  registry:
    address: nacos://localhost:8848
  scan:
    base-packages: com.uav.account.service

# Redisson配置
redisson:
  address: redis://localhost:6379
  database: 0
  timeout: 3000
  pool:
    max-active: 8
    max-idle: 8
    min-idle: 0
    max-wait: -1

# 日志配置
logging:
  level:
    com.uav.account: debug
    com.uav.account.mapper: debug