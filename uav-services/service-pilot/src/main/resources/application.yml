server:
  port: 8203

spring:
  application:
    name: service-pilot
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/uav_pilot?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: UAV_GROUP
      config:
        server-addr: localhost:8848
        namespace: dev
        group: UAV_GROUP
        file-extension: yml

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.uav.model.entity.pilot
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Dubbo配置
dubbo:
  application:
    name: service-pilot
  protocol:
    name: dubbo
    port: 20883
  registry:
    address: nacos://localhost:8848
    parameters:
      namespace: dev
      group: UAV_GROUP
  scan:
    base-packages: com.uav.pilot.service

# Swagger配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 腾讯云COS配置
tencent:
  cos:
    secret-id: your-secret-id
    secret-key: your-secret-key
    region: ap-guangzhou
    bucket-name: your-bucket-name
    base-url: https://your-bucket-name.cos.ap-guangzhou.myqcloud.com

# 日志配置
logging:
  level:
    com.uav.pilot: debug
    com.uav.pilot.mapper: debug